<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Student Login | ExamPro</title><link rel="stylesheet" href="style.css"></head>
<body class="center-page">
<div class="login-box">
<a class="logo center-logo" href="index.html"><span>EXAM</span>PRO</a>
<h1>Student Login</h1><p class="muted">Enter your details to access your examination.</p>
<form id="studentLoginForm">
<label>Student Name<input id="studentName" type="text" placeholder="Enter your full name" required></label>
<label>Student ID<input id="studentId" type="text" placeholder="Enter your student ID" required></label>
<label>Exam Code<input id="examCode" type="text" placeholder="Enter exam code" required></label>
<button class="primary-btn full" type="submit">Continue to Exam</button>
</form>
<p class="back-home"><a href="index.html">← Back to Home</a></p>
</div>
<script src="script.js"></script>
</body>
</html>
